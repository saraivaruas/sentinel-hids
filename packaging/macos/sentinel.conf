# Configuración de Sentinel en macOS (/etc/sentinel/sentinel.conf). Escribe solo lo que quieras cambiar:
# lo que no pongas usa los valores por defecto de macOS. Después de cambiar algo: sudo sentinel detener && sudo sentinel iniciar

[general]
; Usuario que verá las notificaciones
desktop_user =

[allow]
; IPs o redes que nunca se bloquean (la red local, Tailscale y loopback ya están protegidos). Ejemplo: ips = 203.0.113.7
ips =

[ban]
; auto = pf, el cortafuegos de macOS. none = solo avisar
backend = auto
; Duración de cada bloqueo en segundos (86400 = 24 horas)
ttl_seconds = 86400

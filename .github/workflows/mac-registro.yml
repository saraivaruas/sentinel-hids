# Prueba real en macOS del detector de fuerza bruta: provoca accesos (SSH, sudo, su) y comprueba que
# Sentinel avise leyendo el registro del sistema. Solo en equipos desechables de GitHub: crea un
# usuario, le cambia las reglas de sudo y enciende SSH.
name: mac-registro

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/mac-registro.yml", "sentinel/authwatch.py", "tools/prueba-mac-accesos.py"]

permissions:
  contents: read

jobs:
  accesos:
    name: Accesos fallidos en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - name: Encender SSH y crear un usuario de prueba
        run: |
          sw_vers; ssh -V
          sudo sysadminctl -addUser sentinelprueba -password 'Clave-Buena-123'
          sudo dscl . -passwd /Users/sentinelprueba 'Clave-Buena-123'
          dscl . -authonly sentinelprueba 'Clave-Buena-123' && echo "clave de prueba correcta"
          sudo systemsetup -setremotelogin on || true
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/ssh.plist || true
          sudo dseditgroup -o edit -a sentinelprueba -t user com.apple.access_ssh || true
          # Los administradores de estos equipos usan sudo sin clave: a este usuario se le exige.
          echo 'sentinelprueba ALL=(ALL) PASSWD: ALL' | sudo tee /etc/sudoers.d/zz_sentinelprueba >/dev/null
          sudo chmod 440 /etc/sudoers.d/zz_sentinelprueba
          sleep 3
          nc -z 127.0.0.1 22 && echo "SSH escuchando"
      - name: Provocar accesos mientras Sentinel escucha
        run: |
          set +e  # los accesos fallidos son lo que se quiere provocar
          sudo python3 tools/prueba-mac-accesos.py "$RUNNER_TEMP/fin" > "$RUNNER_TEMP/sentinel.txt" 2>&1 &
          escucha=$!
          sleep 8
          intento() { # usuario clave
            printf '#!/bin/sh\necho "%s"\n' "$2" > "$RUNNER_TEMP/clave.sh"; chmod +x "$RUNNER_TEMP/clave.sh"
            SSH_ASKPASS="$RUNNER_TEMP/clave.sh" SSH_ASKPASS_REQUIRE=force ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=2 \
              "$1@127.0.0.1" true </dev/null; echo "ssh $1 -> $?"
          }
          intento noexiste mala
          intento sentinelprueba mala
          intento sentinelprueba Clave-Buena-123
          printf 'a\nb\nc\n' | sudo -u sentinelprueba sudo -k -S true; echo "sudo malo -> $?"
          # su solo pide la clave si hay terminal: expect le da una
          expect -c 'spawn sudo -u sentinelprueba su root -c true; expect "assword:"; send "mala\r"; expect eof'
          sleep 10
          touch "$RUNNER_TEMP/fin"
          wait $escucha; resultado=$?
          cat "$RUNNER_TEMP/sentinel.txt"
          exit $resultado
